listing_slug: industrial-phd-at-superfly-quants-danske-bank

editorial_judgement:
  current_quality: good
  revision_scope: moderate
  central_argument_after_revision: >
    The candidate is a quantitative researcher-builder whose mathematical training,
    probabilistic modelling and optimisation work at RaySearch, and later production
    ML delivery make them a credible fit for research-heavy industrial PhD work on
    high-dimensional pricing methods.
  reviewer_takeaway_after_revision: >
    This applicant can do serious quantitative research, implement it cleanly, and
    translate complex modelling into usable systems; the finance-domain gap is
    managed by a credible transfer rather than by overclaiming.
  primary_revision_goal: >
    Make the research-to-pricing transfer explicit and dominant while keeping the
    production evidence supportive, concise, and fully truthful.

critique_adjudication:
  accepted:
    - critique_reference: must_fix.1
      reason: >
        This correctly identifies the only material weakness in the package: the
        role-specific research/pricing fit is not yet the headline despite strong
        underlying evidence.
    - critique_reference: recommended_edits.2
      reason: >
        The opening currently spends too much of its limited space on general fit
        language. Reaching the modelling-and-implementation remit sooner will improve
        positioning without adding new claims.
    - critique_reference: gap_assessment.C4
      reason: >
        The gap is best handled implicitly rather than by disclaimer language, but
        the transfer needs to be easier for the reviewer to recognise.
  modified:
    - critique_reference: recommended_edits.1
      original_recommendation: >
        Move RaySearch's modelling and optimisation work before the Valcon material
        and make the transfer to tensor-network/pricing research more explicit.
      revised_interpretation: >
        Keep RaySearch as the lead evidence and increase its interpretive weight; the
        order is already broadly correct, so the revision should clarify the
        pricing-research bridge without implying tensor-network expertise.
      reason: >
        The core problem is emphasis and transfer logic, not literal sequencing.
    - critique_reference: recommended_edits.4
      original_recommendation: >
        Trim the tool list slightly if space is tight, keeping the most role-relevant
        tools and methods.
      revised_interpretation: >
        Only compress or reorder the tools line if doing so materially improves
        scanability; retain enough concrete tooling to support the implementation
        case.
      reason: >
        Over-trimming would weaken evidence for the industrial and production side of
        the role.
  rejected:
    - critique_reference: document_assessment.cv.tex.issue_2
      recommendation: >
        Keep only the most relevant tools or move more weight onto methods and
        outcomes.
      reason: >
        The CV already keeps outcomes in the experience section where they belong.
        Moving outcome language into skills would blur document function, and
        aggressive pruning of tools would undersell hands-on implementation range.

global_decisions:
  preserve:
    - The quantitative academic base from KTH, ETH, and economics as the foundation of the fit argument.
    - RaySearch as the strongest truthful research analogue and the clearest evidence of probabilistic modelling and optimisation depth.
    - The distinction between the CV as dense evidence and the cover letter as interpretation.
  remove:
    - Opening abstraction in the cover letter that states fit before showing the research analogue.
    - Any wording that lets Signum read as a direct substitute for finance-specific pricing research.
  reduce:
    - Generic summative phrasing in the cover letter.
    - Keyword-like breadth in the CV skills presentation if it competes with stronger evidence.
  strengthen:
    - The transfer from RaySearch modelling and optimisation work to research-heavy pricing problems.
    - The project-specific bridge between mathematical research and disciplined implementation.
  reorder:
    - The cover-letter emphasis so RaySearch leads the case, Valcon supports implementation and explanation, and Signum closes briefly as current production ownership.
  do_not_add:
    - Any explicit disclaimer about missing derivatives-pricing experience.
    - Any unsupported claim of finance-domain expertise, tensor-network experience, or additional outcomes.
    - Unused evidence E6 or E7.

document_revisions:
  - document: cv.tex
    revision_scope: light
    objective_after_revision: >
      Keep the CV highly scannable while making the profile more concrete and
      ensuring the skills section supports rather than distracts from the main
      evidence.
    preserve:
      - locator: cv.education.kth
        reason: Strongest compact statement of quantitative preparation and academic credibility.
      - locator: cv.experience.raysearch
        reason: Already concise, specific, and well aligned with the research side of the role.
      - locator: cv.experience.valcon
        reason: Efficient evidence of implementation and communication without argumentative padding.
    edits:
      - edit_id: REV1
        priority: should
        locator: cv.profile
        operation: shorten
        issue: The profile sentence is slightly abstract and repeats points the experience section already proves more concretely.
        instruction: >
          Compress the profile into a more evidence-led summary that foregrounds
          quantitative modelling, optimisation, and Python-based ML systems. Remove
          the least informative abstraction instead of adding new claims.
        evidence_ids:
          - E1
          - E2
          - E3
          - E4
        criterion_ids:
          - C1
          - C2
          - C3
        constraints:
          - Do not turn the profile into a mini cover letter.
          - Do not mention pricing or the finance-fit gap here.
          - Keep the line shorter than the current version.
        expected_effect: The CV opens with a sharper, more concrete summary and gets the reviewer to the evidence faster.
      - edit_id: REV2
        priority: should
        locator: cv.skills
        operation: reorder
        issue: The technical skills section is slightly broader than necessary and risks reading as keyword support rather than evidence support.
        instruction: >
          Keep programming and methods prominent, and only compress the tools list if
          doing so improves scanability. Preserve core ML tooling that substantiates
          implementation credibility, but avoid letting platform names outshine
          methods.
        evidence_ids:
          - E5
        criterion_ids:
          - C3
        constraints:
          - Do not add tools, methods, or outcomes not already present.
          - Do not expand the skills section.
          - Keep skills clearly secondary to experience.
        expected_effect: The skills section remains useful for scanning without feeling keyword-driven.
    document_checks:
      - The profile reads as concrete shorthand for the evidence below, not as abstract positioning.
      - RaySearch and Valcon remain more salient than the skills section.
      - The skills section supports implementation credibility without becoming a keyword list.

  - document: cover_letter.tex
    revision_scope: moderate
    objective_after_revision: >
      Make the research-to-pricing bridge the headline of the letter by centring
      RaySearch as the lead analogue, keeping Valcon supportive, and limiting Signum
      to truthful secondary implementation evidence.
    preserve:
      - locator: cover_letter.greeting
        reason: The direct greeting is already appropriate and specific.
      - locator: cover_letter.paragraph_4
        reason: The brief closing is modest, clear, and does not need expansion.
    edits:
      - edit_id: REV3
        priority: must
        locator: cover_letter.paragraph_1
        operation: reframe
        issue: The opening states broad fit competently, but it reaches the role-specific research/pricing case too slowly and relies on generic abstraction.
        instruction: >
          Rebuild the opening around the role's combination of mathematical modelling
          and implementation. State the application directly, then anchor fit in
          quantitative training plus research-style modelling rather than in general
          statements about theory and practical results.
        evidence_ids:
          - E1
          - E2
        criterion_ids:
          - C1
          - C2
          - C4
        constraints:
          - Do not claim derivatives-pricing, tensor-network, or finance-research experience.
          - Avoid generic motivation phrases.
          - Keep the opening concise and in British English.
        expected_effect: The reviewer sees a role-specific quantitative case within the first two sentences.
      - edit_id: REV4
        priority: must
        locator: cover_letter.paragraph_2
        operation: reframe
        issue: RaySearch and Valcon are both useful, but the current paragraph does not make RaySearch clearly dominant as the closest research analogue to the PhD topic.
        instruction: >
          Give RaySearch the clear interpretive lead by emphasising probabilistic
          modelling, optimisation, and collaboration with domain experts as the
          strongest transfer to research-heavy pricing work. Retain Valcon as shorter
          supporting evidence that the candidate can implement, explain, and
          operationalise complex models.
        evidence_ids:
          - E2
          - E3
        criterion_ids:
          - C2
          - C3
          - C4
        constraints:
          - Do not invent finance parallels beyond high-dimensional modelling, optimisation, and research-to-application transfer.
          - Do not turn the paragraph into a chronological CV recap.
          - Keep Valcon visibly secondary to RaySearch.
        expected_effect: The central argument reads as research-first and implementation-capable, rather than broadly ML-engineering.
      - edit_id: REV5
        priority: must
        locator: cover_letter.paragraph_3
        operation: shorten
        issue: The Signum paragraph is useful for current Python ownership, but it risks sounding like a direct domain analogue and includes slightly promotional summary language.
        instruction: >
          Tighten this paragraph so Signum serves only as secondary evidence of
          production ownership and adjacent commercial forecasting context. Keep one
          clear contribution line and one transfer line at most, and remove wording
          that lets this evidence compete with RaySearch for topical relevance.
        evidence_ids:
          - E4
        criterion_ids:
          - C3
          - C4
        constraints:
          - Do not imply direct derivatives-pricing, quantitative finance, or research equivalence.
          - Do not add new Signum responsibilities or outcomes.
          - Keep the paragraph shorter than the current version.
        expected_effect: Signum supports implementation credibility without overstating domain fit or diluting the letter.
    document_checks:
      - The first paragraph establishes the research-to-implementation remit before any broad motivation language.
      - RaySearch is unmistakably the most important evidence block in the letter.
      - Valcon supports implementation and explanation but does not overtake the research case.
      - Signum remains brief and clearly secondary.
      - No sentence implies direct derivatives-pricing experience.

gap_controls:
  - criterion_id: C4
    treatment_after_revision: bridge
    maximum_mentions: 0
    permitted_documents:
      - cover_letter.tex
    exact_control: >
      Do not mention the missing direct pricing background explicitly. Handle this
      criterion only by strengthening the transfer logic: RaySearch carries the
      research analogue, Valcon shows implementation discipline, and Signum remains
      adjacent commercial context rather than a substitute for finance-specific
      experience.

evidence_controls:
  primary_evidence:
    - evidence_id: E2
      required_role: Lead evidence for research-style modelling, optimisation, and technically demanding applied work.
      minimum_visibility: high
    - evidence_id: E1
      required_role: Foundational proof of mathematical preparation and quantitative breadth.
      minimum_visibility: high
  secondary_evidence:
    - evidence_id: E3
      required_role: Supporting evidence of production implementation, communication, and technical leadership.
      minimum_visibility: medium
    - evidence_id: E4
      required_role: Supporting evidence of current Python ownership and adjacent commercial forecasting context.
      minimum_visibility: medium
    - evidence_id: E5
      required_role: Brief skills support for implementation credibility, never a substitute for experience evidence.
      minimum_visibility: low
  prohibited_evidence:
    - evidence_id: E6
      reason: Resume-builder and job-application automation work is off-target for the quantitative finance research case.
    - evidence_id: E7
      reason: Project Iris would dilute the central argument away from research-heavy pricing fit.

claim_controls:
  remove_or_correct:
    - document: cover_letter.tex
      locator: cover_letter.paragraph_3
      issue: Remove or correct any wording that lets pharmaceutical price forecasting read as equivalent to derivatives-pricing research.
      evidence_ids:
        - E4
  preserve_exactly:
    - document: cv.tex
      locator: cv.education.kth
      reason: This is already a strong, precise, and source-grounded statement of quantitative preparation.
    - document: cv.tex
      locator: cv.experience.raysearch
      reason: The existing wording is concrete and already calibrated to the evidence boundaries.
  interpretation_boundaries:
    - evidence_id: E1
      permitted_interpretation: Quantitative academic breadth spanning engineering physics, statistical learning, applied mathematics, and economics.
      prohibited_interpretation: Specialist academic training in derivatives pricing, financial mathematics, or quantitative finance research.
    - evidence_id: E2
      permitted_interpretation: Closest analogue to research-heavy pricing work through probabilistic modelling, optimisation, high-dimensional data, and domain-expert collaboration.
      prohibited_interpretation: Direct prior experience in derivatives pricing, quantitative finance, or tensor-network methods.
    - evidence_id: E3
      permitted_interpretation: Proof of end-to-end implementation, explanation, and operational delivery around production ML.
      prohibited_interpretation: Primary evidence of research fit for the PhD topic.
    - evidence_id: E4
      permitted_interpretation: Current ownership of Python production systems and adjacent commercial price-forecasting context.
      prohibited_interpretation: Equivalent domain evidence for quantitative pricing research or a substitute for finance-specific experience.

final_quality_checks:
  - The revised package still reads as one evidence-grounded argument rather than a collection of added keywords.
  - The cover letter opens with concrete role fit and keeps the strongest evidence closest to the top.
  - The lack of direct derivatives-pricing experience is not explicitly acknowledged anywhere.
  - RaySearch remains the lead research evidence across the package.
  - Signum is truthful, brief, and clearly secondary to RaySearch and Valcon.
  - The CV remains scan-friendly and does not become argumentative.
  - No new claims, metrics, tools, dates, outcomes, or domain expertise are introduced beyond existing evidence.
  - Distinct document functions remain clear: CV for dense evidence, cover letter for interpretation.
