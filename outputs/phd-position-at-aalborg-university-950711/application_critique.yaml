committee_takeaway:
  current: "A quantitatively trained ML researcher-engineer with strong research and production evidence, but only adjacent rather than direct embedded or AI-security experience."
  intended: "A quantitatively strong ML researcher-engineer entering trustworthy embedded AI from an adjacent but credible background, with enough research depth and delivery maturity to grow into the PhD."
