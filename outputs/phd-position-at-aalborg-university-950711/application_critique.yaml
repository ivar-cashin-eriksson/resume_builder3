recommended_edits:
  - rank: 1
    document: cover_letter.tex
    locator: "cover_letter.tex:28-30"
    change: "Tighten the implementation paragraph and make the closing sentence more specific about what the candidate would contribute to the PhD project."
    expected_effect: "The letter will sound sharper and less like a compressed CV."
  - rank: 2
    document: relevant_supporting_documents.tex
    locator: "relevant_supporting_documents.tex:21-23"
    change: "Keep the thesis as the primary supporting item and make Project iris clearly secondary."
    expected_effect: "The supporting documents will better match the listing's research priorities."
  - rank: 3
    document: cv.tex
    locator: "cv.tex:45-53"
    change: "If page space is tight, trim the Project iris wording and keep the skills list focused on the tools most relevant to the PhD case."
    expected_effect: "The CV will stay more obviously centred on research and production ML evidence."
  - rank: 4
    document: application_form_text.tex
    locator: "application_form_text.tex:19-23"
    change: "Shorten the portal text a little further while keeping the same proof points."
    expected_effect: "The text will fit more comfortably into any tight portal field without losing substance."
  - rank: 5
    document: cover_letter.tex
    locator: "cover_letter.tex:22-24"
    change: "Remove any remaining generic framing that does not add selection value."
    expected_effect: "The opening will feel more direct and less template-driven."

revision_guidance:
  keep:
    - "The adjacent-field framing: it is honest and is the strongest available argument from the evidence."
    - "The ordering that leads with eligibility, research depth, and practical ML delivery."
    - "The restrained tone and lack of hype."
  remove:
    - "Any implication that the candidate already has direct embedded, FPGA, or AI-security experience."
    - "Any attempt to inflate Project iris beyond its supporting role."
    - "Generic enthusiasm that does not improve the selection case."
  rewrite:
    - "The cover letter closing so it ends on contribution rather than broad fit language."
    - "The supporting-documents list so the thesis stands out even more clearly as the main evidence."
    - "The portal text so it is slightly more compressed than the letter."
  do_not_do:
    - "Do not add unsupported embedded-security claims."
    - "Do not turn the skills inventory into a keyword dump."
    - "Do not apologise for the lack of direct embedded evidence."
