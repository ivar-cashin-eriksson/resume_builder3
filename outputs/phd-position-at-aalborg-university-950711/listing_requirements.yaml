role_summary:
  purpose: "Develop secure, trustworthy AI methods for resource-constrained embedded systems used in cyber-physical energy systems."
  central_challenge: "Make ML-based monitoring and control both trustworthy and efficient enough to run on small embedded hardware under fault and attack conditions."
  likely_success_definition: "Produce validated methods that detect unsafe or attacked states, run in real time on constrained hardware, and result in publishable research."

