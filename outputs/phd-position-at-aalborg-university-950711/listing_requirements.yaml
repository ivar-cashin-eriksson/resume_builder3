    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: C9
    criterion: "Ability to work in an interdisciplinary environment and collaborate with colleagues from different scientific backgrounds"
    category: communication
    importance: important
