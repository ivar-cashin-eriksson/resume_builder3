responsibilities:
  - id: R1
    responsibility: "Develop secure and trustworthy AI for resource-constrained embedded systems in cyber-physical energy applications."
    importance: core
    source_excerpt: "The PhD position focuses on the development of secure and trustworthy AI for resource-constrained embedded systems."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: R2
    responsibility: "Design machine learning models that detect unusual, unsafe, or attacked operating conditions."
    importance: core
    source_excerpt: "Designing machine learning models that can detect unusual, unsafe, or attacked operating conditions."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: R3
    responsibility: "Develop data-driven models of fault and attack propagation to improve resilient monitoring and control."
    importance: core
    source_excerpt: "Developing data-driven models that capture how faults and attacks spread through a system, and using them to make AI-based monitoring and control more resilient."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: R4
    responsibility: "Study the security and integrity of deployed ML models so AI-based decisions remain trustworthy under failure or manipulation."
    importance: core
    source_excerpt: "Studying the security and integrity of deployed ML models, so that AI-based decisions stay trustworthy when something goes wrong or is deliberately manipulated."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: R5
    responsibility: "Build lightweight, efficient models that run in real time on constrained hardware."
    importance: core
    source_excerpt: "Building lightweight, efficient models that can run in real time on constrained hardware."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: R6
    responsibility: "Implement and evaluate methods on embedded platforms and hardware prototypes with a second PhD student."
    importance: core
    source_excerpt: "Implementing and evaluating the methods on embedded platforms and hardware prototypes, in collaboration with a second PhD student."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"
  - id: R7
    responsibility: "Share results through publications in relevant AI, security, and systems venues."
    importance: supporting
    source_excerpt: "Sharing results through publications in relevant AI, security, and systems venues."
    source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"

