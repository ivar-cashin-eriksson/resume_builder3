listing:
  title: "PhD Stipend in AI:HARDWARE Lab for Secure Embedded AI"
  organisation: "Aalborg University"
  team: "AI:HARDWARE Lab; Cybersecurity Research Group"
  department: "Department of Electronic Systems"
  location: "Copenhagen"
  employment_type: "Full time"
  seniority: "PhD"
  source_url: "https://www.vacancies.aau.dk/phd-positions/show-vacancy/vacancyId/950711"

role_type:
  primary: academic
  subtype: PhD stipend / doctoral research position
  confidence: high

role_summary:
  purpose: "Conduct doctoral research on secure and trustworthy AI for resource-constrained embedded systems, with applications in cyber-physical energy systems."
  central_challenge: "Designing ML methods that remain reliable, secure, and efficient enough to run on constrained hardware in real-world cyber-physical settings."
  likely_success_definition: "Produce research results that can be implemented and evaluated on embedded platforms, contribute to relevant publications, and progress through the PhD programme requirements."

