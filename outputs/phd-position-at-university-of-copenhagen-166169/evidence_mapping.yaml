      - outputs/phd-position-at-university-of-copenhagen-166169/job_analysis.md
      - outputs/phd-position-at-university-of-copenhagen-166169/listing.md
      - profile/experience.yaml
      - profile/education.yaml
  background:
    claim: The research background comes from engineering physics, statistical learning, Applied Mathematics at ETH, and RaySearch work on 3D CT scans.
